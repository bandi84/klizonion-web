<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Log in · Klizonion</title><link rel="stylesheet" href="static/style.css?v=v01-final"></head><body><div class="beta">BETA · V0.1</div><main class="auth-wrap"><section class="auth"><a class="back" href="index.html">← Klizonion</a><div class="brand"><span class="logo">K</span><span>KLIZONION</span><span class="ver">v0.1</span></div><h1>Welcome back.</h1><p class="sub">Open your workspace and continue building.</p><form id="form" class="form"><div class="field"><label>Username or email</label><input id="identifier" autocomplete="username" required></div><div class="field"><label>Password</label><input id="password" type="password" autocomplete="current-password" required></div><button class="button primary" type="submit">Log in</button><div class="msg" id="msg"></div></form><div class="notice">Your session stays active until it expires or you explicitly log out.</div><p style="text-align:center;color:#777;font-size:12px;margin-top:24px">New here? <a href="register.html" style="text-decoration:underline">Create an account</a></p></section></main><script>const API="https://klizonion-agent.umamaheswara-bandi84.workers.dev";if(localStorage.getItem("klizonion_token"))location.replace("dashboard.html");const form=document.getElementById("form"),msg=document.getElementById("msg");form.addEventListener("submit",async e=>{e.preventDefault();msg.textContent="";const b=e.submitter;b.disabled=true;b.textContent="Logging in…";try{const r=await fetch(API+"/api/auth/login",{method:"POST",headers:{"content-type":"application/json"},body:JSON.stringify({identifier:document.getElementById("identifier").value.trim(),password:document.getElementById("password").value})});const d=await r.json().catch(()=>({}));if(!r.ok)throw new Error(d.error||"invalid_credentials");localStorage.setItem("klizonion_token",d.token);localStorage.setItem("klizonion_user",JSON.stri
