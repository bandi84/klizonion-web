<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Dashboard • Klizonion v0.01</title>
  <link rel="stylesheet" href="static/style.css">
</head>
<body>
  <main class="shell">
    <header class="topbar"><div><div class="pill">KLIZONION • v0.01</div><h1 id="hello">Dashboard</h1></div><button id="logout" class="button">Log out</button></header>
    <div class="grid dashboard-grid">
      <section class="card"><h3>Account</h3><p id="account">Loading…</p></section>
      <section class="card"><h3>Workspaces</h3><p id="workspaces">Loading…</p></section>
      <section class="card"><h3>Cloud API</h3><p id="health">Checking…</p></section>
      <section class="card"><h3>Model</h3><p>Prebuilt model + knowledge gateway ready. Connect the model server to enable generation.</p></section>
    </div>
  </main>
<script>
const API = "https://klizonion-agent.umamaheswara-bandi84.workers.dev";
const token = localStorage.getItem("klizonion_token");
if (!token) location.href = "login.html";
const auth = {Authorization: "Bearer " + token};
async function load() {
  try {
    const [meR, hR] = await Promise.all([
      fetch(API + "/api/v1/me", {headers: auth}),
      fetch(API + "/api/health")
    ]);
    const me = await meR.json();
    const h = await hR.json();
    if (!me.authenticated) throw new Error("session_expired");
    document.getElementById("hello").textContent = "Welcome, " + me.user.username;
    document.getElementById("account").textContent = me.user.email;
    document.getElementById("workspaces").textContent = (me.workspaces || []).length + " workspace(s)";
    document.getElementById("health").textContent = h.status + " • database " + (h.database ? "online" : "offline");
  } catch (e) {
    localStorage.removeItem("klizonion_token");
    location.href = "login.html";
  }
}
document.getElementById("logout").onclick = async () => {
  await fetch(API + "/api/auth/logout", {method:"POST", headers: auth});
  localStorage.removeItem("klizonion_token");
  localStorage.removeItem("klizonion_user");
  location.href = "index.html";
};
load();
</script>
</body>
</html>
