<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Create account · Klizonion</title><link rel="stylesheet" href="static/style.css"><script src="https://challenges.cloudflare.com/turnstile/v0/api.js" async defer></script></head><body><main class="shell auth"><section class="auth-card card">
<div class="auth-top"><a class="back" href="index.html">← Klizonion</a><div class="brand-row" style="margin-top:18px"><div class="logo">K</div><div class="brand">KLIZONION</div><div class="version">v1.0</div></div><h1 class="auth-title">Create your workspace.</h1><p class="auth-sub">Create one account, verify your email, and your workspace is ready.</p></div>
<section id="registerPanel"><form id="registerForm" class="form" novalidate><div class="field"><label for="usernameInput">Username</label><input id="usernameInput" autocomplete="username" required minlength="2" maxlength="32"></div><div class="field"><label for="emailInput">Email</label><input id="emailInput" type="email" autocomplete="email" required></div><div class="field"><label for="passwordInput">Password</label><input id="passwordInput" type="password" autocomplete="new-password" required minlength="8"></div><div class="field"><label for="confirmInput">Confirm password</label><input id="confirmInput" type="password" autocomplete="new-password" required minlength="8"></div><div id="turnstile" class="turnstile-slot"></div><button id="registerButton" class="button primary" type="submit">Create account</button><div id="message" class="message" role="alert"></div></form></section>
<section id="verifyPanel" class="verify-box" hidden><div class="empty-logo">✓</div><h2 style="margin:0;font-size:21px">Check your inbox.</h2><p id="verifyText" class="auth-sub">We sent a 16-digit verification code to your email.</p><form id="verifyForm" class="form" novalidate><div class="field"><label for="codeInput">16-digit verification code</label><input id="codeInput" class="verify-code" inputmode="numeric" autocomplete="one-time-code" maxlength="16" placeholder="0000000000000000" required></div><button id="verifyButton" class="button primary" type="submit">Verify account</button><div id="verifyMessage" class="message" role="alert"></div></form></section>
<div class="auth-foot">Already have an account? <a href="login.html">Log in</a></div></section></main><script>
const API="https://klizonion-agent.umamaheswara-bandi84.workers.dev"; if(localStorage.getItem("klizonion_token")) location.replace("dashboard.html");
const TURNSTILE_SITE_KEY="PASTE_YOUR_TURNSTILE_SITE_KEY_HERE";let widgetId=null,pendingId=null;const $=id=>document.getElementById(id);
async function bootstrap(){if(TURNSTILE_SITE_KEY.includes("PASTE_"))return;let i=0;while(!window.turnstile&&i<40){await new Promise(r=>setTimeout(r,250));i++;}if(window.turnstile)widgetId=window.turnstile.render("#turnstile",{sitekey:TURNSTILE_SITE_KEY,theme:"dark"});}window.addEventListener("load",bootstrap);
$("registerForm").addEventListener("submit",async e=>{e.preventDefault();$("message").textContent="";if($("passwordInput").value!==$("confirmInput").value){$("message").className="message error";$("message").textContent="Passwords do not match.";return}let turnstile_token="";if(widgetId!==null)turnstile_token=window.turnstile.getResponse(widgetId);else if(TURNSTILE_SITE_KEY.includes("PASTE_")){ $("message").className="message error";$("message").textContent="Verification protection is not configured yet.";return }const b=$("registerButton");b.disabled=true;b.textContent="Sending code…";try{const r=await fetch(API+"/api/auth/register",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({username:$("usernameInput").value.trim(),email:$("emailInput").value.trim(),password:$("passwordInput").value,turnstile_token})});const d=await r.json().catch(()=>({}));if(!r.ok)throw new Error(d.error||"registration_failed");pendingId=d.pending_id;$("registerPanel").hidden=true;$("verifyPanel").hidden=false;$("verifyText").textContent=`We sent a 16-digit code to ${$("emailInput").value.trim()}. It expires in 10 minutes.`;$("codeInput").focus()}catch(err){const m={invalid_email:"Enter a valid email address.",invalid_username:"Username must be at least 2 characters.",password_too_short:"Password must be at least 8 characters.",email_already_registered:"That email is already registered.",username_already_registered:"That username is already registered.",turnstile_required:"Please complete verification.",turnstile_failed:"Verification failed. Try again.",turnstile_not_configured:"Account protection is not configured yet.",email_service_not_configured:"Email delivery is not configured yet.",verification_email_failed:"We couldn't send the code. Try again.",rate_limited:"Too many attempts. Try again later."};$("message").className="message error";$("message").textContent=m[err.message]||"Could not create the account."}finally{b.disabled=false;b.textContent="Create account"}});
$("verifyForm").addEventListener("submit",async e=>{e.preventDefault();const code=$("codeInput").value.replace(/\D/g,"").slice(0,16);$("codeInput").value=code;if(code.length!==16){$("verifyMessage").className="message error";$("verifyMessage").textContent="Enter all 16 digits.";return}const b=$("verifyButton");b.disabled=true;b.textContent="Verifying…";try{const r=await fetch(API+"/api/auth/verify",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({pending_id:pendingId,code})});const d=await r.json().catch(()=>({}));if(!r.ok)throw new Error(d.error||"verification_failed");localStorage.setItem("klizonion_token",d.token);localStorage.setItem("klizonion_user",JSON.stringify(d.user));location.replace("dashboard.html")}catch(err){const m={invalid_verification_code:"That code isn't correct.",verification_expired:"That code expired.",verification_not_found:"That verification request no longer exists.",too_many_verification_attempts:"Too many attempts. Start again.",rate_limited:"Too many attempts. Try again later."};$("verifyMessage").className="message error";$("verifyMessage").textContent=m[err.message]||"Verification failed."}finally{b.disabled=false;b.textContent="Verify account"}});
</script></body></html>
