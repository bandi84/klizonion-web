<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Create account • Klizonion v0.01</title>
<link rel="stylesheet" href="static/style.css">
</head>
<body>
<main class="shell auth-shell">
<div class="pill">KLIZONION • v0.01</div>
<h1>Start your workspace.</h1>
<p class="muted">Create your Klizonion account.</p>
<form id="registerForm" class="panel" novalidate>
<label>Username<input id="usernameInput" autocomplete="username" required minlength="2" maxlength="32"></label>
<label>Email<input id="emailInput" type="email" autocomplete="email" required></label>
<label>Password<input id="passwordInput" type="password" autocomplete="new-password" required minlength="8"></label>
<label>Confirm password<input id="confirmInput" type="password" autocomplete="new-password" required minlength="8"></label>
<button id="registerButton" class="button primary" type="submit">Create account</button>
<div id="message" class="message" role="alert"></div>
</form>
<p class="muted">Already have an account? <a href="login.html">Log in</a></p>
</main>
<script>
const API = "https://klizonion-agent.umamaheswara-bandi84.workers.dev";
const form = document.getElementById("registerForm");
const usernameInput = document.getElementById("usernameInput");
const emailInput = document.getElementById("emailInput");
const passwordInput = document.getElementById("passwordInput");
const confirmInput = document.getElementById("confirmInput");
const button = document.getElementById("registerButton");
const message = document.getElementById("message");

form.addEventListener("submit", async (e) => {
  e.preventDefault();
  message.textContent = "";
  if (passwordInput.value !== confirmInput.value) {
    message.textContent = "Passwords do not match.";
    confirmInput.focus();
    return;
  }
  button.disabled = true;
  button.textContent = "Creating…";
  try {
    const r = await fetch(API + "/api/auth/register", {
      method: "POST",
      headers: {"Content-Type":"application/json"},
      body: JSON.stringify({
        username: usernameInput.value.trim(),
        email: emailInput.value.trim(),
        password: passwordInput.value
      })
    });
    const data = await r.json().catch(() => ({}));
    if (!r.ok) throw new Error(data.error || "registration_failed");
    localStorage.setItem("klizonion_token", data.token);
    localStorage.setItem("klizonion_user", JSON.stringify(data.user));
    location.href = "dashboard.html";
  } catch (err) {
    const messages = {
      invalid_email: "Enter a valid email address.",
      invalid_username: "Username must be at least 2 characters.",
      password_too_short: "Password must be at least 8 characters.",
      email_already_registered: "That email is already registered.",
      registration_failed: "Could not create the account."
    };
    message.textContent = messages[err.message] || "Could not create the account.";
  } finally {
    button.disabled = false;
    button.textContent = "Create account";
  }
});
</script>
</body>
</html>
