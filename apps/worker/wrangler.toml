name = "klizonion-agent"
main = "src/index.js"
compatibility_date = "2026-09-09"

[vars]
BUILDER_PROTOCOL_VERSION = "0.2"
ENVIRONMENT = "production"

# Public Cloudflare Turnstile Sitekey
TURNSTILE_SITEKEY = "0x4AAAAAAEu-k2LbW0bmTFZb"

# Email Configuration
EMAIL_FROM = "KLIZONION <reddybhuvanlaxmi@gmail.com>"
FRONTEND_ORIGIN = "https://klizonion.vexr.dev"
VERIFICATION_FROM = "verify@klizonion.vexr.dev"

# Cloudflare Workers AI Binding (anthropic/claude-fable-5.1)
[ai]
binding = "AI"

# Secure Vault D1 Database Binding
[[d1_databases]]
binding = "DB"
database_name = "model-backend"
database_id = "17e6e6db-e50e-4978-a813-1d54a6dd513e"
migrations_dir = "migrations"

# Cloudflare Email Routing Binding
[[send_email]]
name = "EMAIL"

# ==============================================================================
# SECRETS
# NEVER put these values directly in this file.
# Set them with Wrangler:
#
# npx wrangler secret put TURNSTILE_SECRET --name klizonion-agent
# npx wrangler secret put EMAIL_API_KEY --name klizonion-agent
# npx wrangler secret put RUNNER_SHARED_SECRET --name klizonion-agent
#
# EMAIL_API_KEY = Elastic Email API key
# TURNSTILE_SECRET = Cloudflare Turnstile secret
# RUNNER_SHARED_SECRET = Local runner authentication secret
# ==============================================================================